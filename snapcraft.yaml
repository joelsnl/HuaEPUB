# From the repo root, with snapcraft 8: snapcraft
name: huaepub
base: core22
version: '2.16.0'
summary: Download and translate Chinese web novels to EPUB format
description: |
  HuaEPUB downloads Chinese web novels, translates them to English,
  and builds EPUB files.
grade: devel
confinement: strict

platforms:
  amd64:

apps:
  huaepub:
    command: bin/huaepub
    desktop: share/applications/org.joelsnl.HuaEPUB.desktop
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - network-bind
      - home

parts:
  huaepub:
    plugin: python
    source: .
    stage-packages:
      - libgl1
      - libegl1
      - libfontconfig1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libdbus-1-3
      - fonts-noto-cjk
    override-build: |
      craftctl default
      install -Dm644 packaging/org.joelsnl.HuaEPUB.desktop "$CRAFT_PART_INSTALL/share/applications/org.joelsnl.HuaEPUB.desktop"
      install -Dm644 packaging/org.joelsnl.HuaEPUB.svg "$CRAFT_PART_INSTALL/share/icons/hicolor/scalable/apps/org.joelsnl.HuaEPUB.svg"
      install -Dm644 packaging/org.joelsnl.HuaEPUB.metainfo.xml "$CRAFT_PART_INSTALL/share/metainfo/org.joelsnl.HuaEPUB.metainfo.xml"

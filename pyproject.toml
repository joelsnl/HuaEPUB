[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HuaEPUB"
description = "Download and translate Chinese web novels to EPUB format"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [
    {name = "Joel Sunil", email = "joelsnl@gmail.com"}
]
keywords = [
    "webnovel",
    "ebook",
    "epub",
    "translator",
    "chinese",
    "xianxia",
    "wuxia",
]
dynamic = ["version", "dependencies"]

[project.scripts]
huaepub = "gui.app:run"

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "parsers*"]

[tool.setuptools.package-data]
gui = ["style.qss", "assets/*"]
parsers = ["sites.json"]
"core.translation" = ["data/*.json"]
"core.polish" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "build",
    "dist",
    ".update_backup",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Bug-finding rules only — do not fail CI on style/format of the existing tree.
select = [
    "E9",
    "F401",
    "F63",
    "F7",
    "F82",
    "F811",
    "F821",
    "F822",
    "F823",
]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "build",
    "dist",
    ".update_backup",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Bug-finding rules only — do not fail CI on style/format of the existing tree.
select = [
    "E9",
    "F401",
    "F63",
    "F7",
    "F82",
    "F811",
    "F821",
    "F822",
    "F823",
]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = false

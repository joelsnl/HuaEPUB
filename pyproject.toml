[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HuaEPUB"
version = "2.15.0"
description = "Download and translate Chinese web novels to EPUB format"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
authors = [
    {name = "Joel Sunil", email = "joelsnl@gmail.com"}
]
maintainers = [
    {name = "Joel Sunil", email = "joelsnl@gmail.com"}
]
categories = ["Utilities"]
keywords = [
    "webnovel",
    "ebook",
    "epub",
    "translator",
    "chinese",
    "xianxia",
    "wuxia",
]
dynamic = ["dependencies"]

[project.scripts]
huaepub = "gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "parsers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "build",
    "dist",
    ".update_backup",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Bug-finding rules only — do not fail CI on style/format of the existing tree.
select = [
    "E9",
    "F401",
    "F63",
    "F7",
    "F82",
    "F811",
    "F821",
    "F822",
    "F823",
]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = false

    <h1>第1章 陌生的开始</h1>
    <div id="content">
        这是正文的第一段，包含了足够多的中文字符来让启发式算法识别出这是章节的正文内容区域，而不是导航或者其他页面元素。文字越多，内容密度评分就越高，越容易被正确识别。
        这是正文的第二段，同样包含了大量的叙述性文字。主角走在陌生的街道上，看着来来往往的行人，心中充满了对未来的期待和一丝不安。街边的小贩叫卖着热气腾腾的食物，空气中弥漫着诱人的香味。
        这是正文的第三段。夜幕降临，城市的灯火渐渐亮起，故事才刚刚开始。他知道，从今天起，一切都会不一样了。远处的高楼在夜色中若隐若现，仿佛在预示着一段全新旅程的开端。

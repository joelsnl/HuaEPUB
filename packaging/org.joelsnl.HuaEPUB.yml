# From the repo root:
#   flatpak-builder --force-clean --user --install build-dir packaging/org.joelsnl.HuaEPUB.yml
# Freedesktop 25.08 is the supported runtime. PySide6's wheel brings Qt.
app-id: org.joelsnl.HuaEPUB
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: huaepub
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
modules:
  - name: huaepub
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    sources:
      - type: dir
        path: ..
    build-commands:
      - python3 -m pip install --prefix=${FLATPAK_DEST} --no-cache-dir .
      - install -Dm644 packaging/org.joelsnl.HuaEPUB.desktop ${FLATPAK_DEST}/share/applications/org.joelsnl.HuaEPUB.desktop
      - install -Dm644 packaging/org.joelsnl.HuaEPUB.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/org.joelsnl.HuaEPUB.svg
      - mkdir -p ${FLATPAK_DEST}/share/metainfo
      - sed "s/@VERSION@/$(tr -d '[:space:]' < VERSION)/" packaging/org.joelsnl.HuaEPUB.metainfo.xml > ${FLATPAK_DEST}/share/metainfo/org.joelsnl.HuaEPUB.metainfo.xml

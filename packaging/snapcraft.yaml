name: huaepub
version: '2.15.0'
summary: Download and translate Chinese web novels to EPUB format
description: |
  HuaEPUB is a desktop application that downloads Chinese web novels,
  translates them to English, and builds ready-to-read EPUB files.
  
  Features:
  - Downloads from 100+ novel websites
  - Multiple translation options (Google, LibreTranslate, Ollama, Offline NMT)
  - Local AI polishing for better English quality
  - Automatic watermark and ad removal
  - Library management with update tracking
  - In-app EPUB reader
  - Optional Google Drive sync across devices

grade: stable
dconfinement: strict
base: core22

architectures:
  - build-on: [amd64]
  - build-for: [amd64]

parts:
  huaepub:
    plugin: python
    source: .
    python-packages:
      - pip
      - setuptools
      - wheel
      # Core dependencies from requirements.txt
      - curl_cffi>=0.5.0
      - requests>=2.28.0
      - lxml>=4.9.0
      - beautifulsoup4>=4.11.0
      - ebooklib>=0.18
      - PySide6>=6.5.0
      - httpx>=0.27
      - rich>=13.7
      - pypinyin>=0.51
      - Pillow>=9.0.0
      - packaging>=21.0
      - google-api-python-client>=2.100.0
      - google-auth-oauthlib>=1.1.0
      - google-auth-httplib2>=0.2.0
    override-pull: |
      snapcraft pull
      # Ensure we have the latest version
      sed -i 's/^version:.*/version: '"$(git describe --tags 2>/dev/null || echo "latest")"'/' snapcraft.yaml
    build-environment:
      - LDFLAGS: "-Wl,-rpath,$SNAPCRAFT_PART_INSTALL/lib"

apps:
  huaepub:
    command: bin/huaepub
    desktop: bin/org.joelsnl.HuaEPUB.desktop
    plugs:
      # Desktop integration
      - desktop
      - desktop-legacy
      - wayland
      - x11
      # Network access for downloading novels
      - network
      - network-bind
      # Home directory access for books and settings
      - home
      # Notifications
      - notifications
    environment:
      QT_QPA_PLATFORM: "xcb"
      PYSIDE6_FORK_SUPPORT: "0"  # Avoid Qt fork issues

layout:
  /usr/share/icons/hicolor:
    bind: $SNAP/usr/share/icons/hicolor
  /usr/share/themes:
    bind: $SNAP/usr/share/themes

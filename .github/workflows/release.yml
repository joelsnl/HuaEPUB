name: Build Release

# Builds standalone executables when a version tag is pushed (e.g. v2.1.0)
# and attaches them (plus SHA256SUMS) to the GitHub release.
# The in-app updater downloads these assets and verifies the checksums.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: HuaEPUB-windows.zip
            exe: HuaEPUB.exe
            legacy_exe: NovelDownloader.exe
          - os: macos-latest
            asset: HuaEPUB-macos.zip
            exe: HuaEPUB
            legacy_exe: NovelDownloader
          - os: ubuntu-latest
            asset: HuaEPUB-linux.zip
            exe: HuaEPUB
            legacy_exe: NovelDownloader
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python build.py

      - name: Zip executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/${{ matrix.exe }}" "dist/${{ matrix.legacy_exe }}"
          Compress-Archive -Path "dist/${{ matrix.exe }}","dist/${{ matrix.legacy_exe }}" -DestinationPath "${{ matrix.asset }}"

      - name: Zip executable (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cp "dist/${{ matrix.exe }}" "dist/${{ matrix.legacy_exe }}"
          cd dist && zip "../${{ matrix.asset }}" "${{ matrix.exe }}" "${{ matrix.legacy_exe }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Bundle checksummed source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.zip" \
            -o HuaEPUB-source.zip
          # Legacy alias so older source updaters still find a checksummed archive
          cp HuaEPUB-source.zip novelDownloader-source.zip
          sha256sum HuaEPUB-*.zip novelDownloader-source.zip > SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            HuaEPUB-*.zip
            novelDownloader-source.zip
            SHA256SUMS.txt

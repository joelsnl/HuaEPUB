name: Build Release

# Builds standalone executables when a version tag is pushed (e.g. v2.1.0)
# and attaches them (plus SHA256SUMS) to the GitHub release.
# The in-app updater downloads these assets and verifies the checksums.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: NovelDownloader-windows.zip
            exe: NovelDownloader.exe
          - os: macos-latest
            asset: NovelDownloader-macos.zip
            exe: NovelDownloader
          - os: ubuntu-latest
            asset: NovelDownloader-linux.zip
            exe: NovelDownloader
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python build.py

      - name: Zip executable (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/${{ matrix.exe }}" -DestinationPath "${{ matrix.asset }}"
        shell: pwsh

      - name: Zip executable (macOS / Linux)
        if: runner.os != 'Windows'
        run: cd dist && zip "../${{ matrix.asset }}" "${{ matrix.exe }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum NovelDownloader-*.zip > SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NovelDownloader-*.zip
            SHA256SUMS.txt

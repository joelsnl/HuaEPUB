name: Build Release

# Builds standalone executables when a version tag is pushed (e.g. v3.1.0)
# and attaches them (plus SHA256SUMS) to the GitHub release.
# The in-app updater downloads these assets and verifies the checksums
# (fail closed — no unsigned main.zip fallback).
# Builds do not start until the offline pytest suite passes.

on:
  push:
    tags:
      - "v*"
  # Run it by hand on a branch to check the builds without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    needs: test
    strategy:
      fail-fast: false   # one OS failing should not hide how the others did
      matrix:
        include:
          - os: windows-latest
            asset: HuaEPUB-windows.zip
            exe: HuaEPUB.exe
          - os: macos-latest
            asset: HuaEPUB-macos.zip
            exe: HuaEPUB
          - os: ubuntu-latest
            asset: HuaEPUB-linux.zip
            exe: HuaEPUB
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt
          # Pillow is only for the build: PyInstaller turns the PNG icon into .icns with it on macOS.
          pip install pyinstaller==6.22.2 pillow

      - name: Build executable
        run: python build.py

      - name: Zip executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.exe }}" -DestinationPath "${{ matrix.asset }}"

      - name: Zip executable (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist && zip "../${{ matrix.asset }}" "${{ matrix.exe }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Bundle checksummed source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -fsSL \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.zip" \
            -o HuaEPUB-source.zip
          sha256sum HuaEPUB-*.zip > SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            HuaEPUB-*.zip
            SHA256SUMS.txt
